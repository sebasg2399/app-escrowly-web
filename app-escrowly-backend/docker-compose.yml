version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: escrowly-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: escrowly
      POSTGRES_PASSWORD: escrowly
      POSTGRES_DB: escrowly
    volumes:
      - escrowly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrowly -d escrowly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  escrowly-pgdata:
